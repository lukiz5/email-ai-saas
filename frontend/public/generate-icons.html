<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
</head>
<body>
    <h1>Email AI Icons Generator</h1>
    <p>Right-click on the canvases below and save as PNG</p>

    <h2>192x192 Icon</h2>
    <canvas id="icon192" width="192" height="192"></canvas>

    <h2>512x512 Icon</h2>
    <canvas id="icon512" width="512" height="512"></canvas>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#0ea5e9');
            gradient.addColorStop(1, '#0369a1');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Draw email envelope icon
            const padding = size * 0.2;
            const envWidth = size - (padding * 2);
            const envHeight = envWidth * 0.7;
            const startX = padding;
            const startY = (size - envHeight) / 2;

            // Envelope body
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(startX, startY, envWidth, envHeight);

            // Envelope flap
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX + envWidth / 2, startY + envHeight / 2);
            ctx.lineTo(startX + envWidth, startY);
            ctx.closePath();
            ctx.fillStyle = '#f0f9ff';
            ctx.fill();
            ctx.strokeStyle = '#0ea5e9';
            ctx.lineWidth = size * 0.01;
            ctx.stroke();

            // AI sparkle
            const sparkleSize = size * 0.15;
            const sparkleX = startX + envWidth - sparkleSize / 2;
            const sparkleY = startY + envHeight - sparkleSize / 2;

            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const angle = (Math.PI / 2) * i;
                const x = sparkleX + Math.cos(angle) * sparkleSize;
                const y = sparkleY + Math.sin(angle) * sparkleSize;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.fill();
        }

        drawIcon(document.getElementById('icon192'), 192);
        drawIcon(document.getElementById('icon512'), 512);
    </script>
</body>
</html>
