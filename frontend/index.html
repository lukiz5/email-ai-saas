<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Primary Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Email AI SaaS - AI-Powered Email Summarization</title>
    <meta name="description" content="Summarize your emails with AI. Get smart insights, action items, and priority scoring. Works with Gmail, Outlook, and IMAP." />

    <!-- PWA App Manifest -->

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0ea5e9" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Prevent text size adjustment on orientation change -->

    <meta property="og:type" content="website" />
